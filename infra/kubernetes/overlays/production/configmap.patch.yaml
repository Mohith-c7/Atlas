apiVersion: v1
kind: ConfigMap
metadata:
  name: faios-config
  namespace: faios
data:
  APP_ENV: production
  NEXT_PUBLIC_BUSINESS_API_URL: https://api.faios.example.com
  PUBLIC_WEB_URL: https://app.faios.example.com
  LOG_LEVEL: info
  FAIOS_TRACING_ENABLED: "true"
  FAIOS_SERVICE_NAME: faios-production
  WORKER_EXECUTION_CONCURRENCY: "4"
  MEMORY_VECTOR_WORKER_CONCURRENCY: "6"
