apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: faios-web
  namespace: faios
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: faios-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
