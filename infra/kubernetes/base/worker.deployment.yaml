apiVersion: apps/v1
kind: Deployment
metadata:
  name: faios-workers
  namespace: faios
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: faios-workers
  template:
    metadata:
      labels:
        app: faios-workers
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: workers
          image: faios/workers:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9101
              name: metrics
          envFrom:
            - configMapRef:
                name: faios-config
            - secretRef:
                name: faios-secrets
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9101
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9101
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
