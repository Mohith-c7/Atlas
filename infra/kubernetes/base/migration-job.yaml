apiVersion: batch/v1
kind: Job
metadata:
  name: faios-prisma-migrate
  namespace: faios
  annotations:
    faios.openai.com/runbook: docs/production-deployment-runbook.md
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: faios-prisma-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: faios/business-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - pnpm
            - --filter
            - "@faios/database"
            - exec
            - prisma
            - migrate
            - deploy
            - --schema
            - prisma/schema.prisma
          envFrom:
            - configMapRef:
                name: faios-config
            - secretRef:
                name: faios-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
