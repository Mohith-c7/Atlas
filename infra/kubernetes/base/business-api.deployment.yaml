apiVersion: apps/v1
kind: Deployment
metadata:
  name: faios-business-api
  namespace: faios
spec:
  replicas: 2
  selector:
    matchLabels:
      app: faios-business-api
  template:
    metadata:
      labels:
        app: faios-business-api
    spec:
      containers:
        - name: business-api
          image: faios/business-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: faios-config
            - secretRef:
                name: faios-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
