apiVersion: v1
kind: Service
metadata:
  name: faios-web
  namespace: faios
spec:
  selector:
    app: faios-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: faios-business-api
  namespace: faios
spec:
  selector:
    app: faios-business-api
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: faios-ai-orchestrator
  namespace: faios
spec:
  selector:
    app: faios-ai-orchestrator
  ports:
    - name: http
      port: 8000
      targetPort: 8000
