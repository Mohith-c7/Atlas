apiVersion: v1
kind: ConfigMap
metadata:
  name: faios-config
  namespace: faios
data:
  APP_ENV: production
  APP_NAME: Founder AI Operating System
  AI_ORCHESTRATOR_URL: http://faios-ai-orchestrator:8000
  BUSINESS_API_URL: http://faios-business-api:4000
  NEXT_PUBLIC_BUSINESS_API_URL: https://api.example.com
  PUBLIC_WEB_URL: https://app.example.com
  EXECUTION_DISPATCH_ENABLED: "true"
  WORKER_RABBITMQ_CONSUMER_ENABLED: "true"
  WORKER_EXECUTION_LOOP_ENABLED: "false"
  WORKER_EXECUTION_POLL_INTERVAL_MS: "5000"
  WORKER_REAL_PROVIDER_ADAPTERS_ENABLED: "true"
  QDRANT_URL: http://qdrant:6333
  QDRANT_MEMORY_COLLECTION: faios_memory
  MEMORY_EMBEDDING_PROVIDER: auto
  MEMORY_EMBEDDING_DIMENSIONS: "1536"
  MEMORY_VECTOR_SYNC_MODE: async
  OPENAI_API_BASE_URL: https://api.openai.com/v1
  OPENAI_EMBEDDING_MODEL: text-embedding-3-small
  LOG_LEVEL: info
