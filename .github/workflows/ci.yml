name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://faios:faios@localhost:5432/faios_shadow?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: faios
          POSTGRES_PASSWORD: faios
          POSTGRES_DB: faios_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faios -d faios_shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level critical

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI Orchestrator dependencies
        run: python -m pip install -e "services/ai-orchestrator[dev]"

      - name: Generate Prisma Client
        run: pnpm --filter @faios/database exec prisma generate --schema prisma/schema.prisma

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma schema
        run: pnpm --filter @faios/database exec prisma validate --schema prisma/schema.prisma

      - name: Prisma migration drift
        run: pnpm --filter @faios/database prisma:migrate:diff

      - name: AI Orchestrator lint
        run: python -m ruff check services/ai-orchestrator/src services/ai-orchestrator/tests

      - name: AI Orchestrator tests
        run: python -m pytest services/ai-orchestrator/tests

      - name: Build
        run: pnpm build

  execution-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: faios
          POSTGRES_PASSWORD: faios
          POSTGRES_DB: faios_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faios -d faios_shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: faios
          RABBITMQ_DEFAULT_PASS: faios
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://faios:faios@localhost:5432/faios_shadow?schema=public
      RABBITMQ_URL: amqp://faios:faios@localhost:5672
      FAIOS_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      FAIOS_ENCRYPTION_KEY_VERSION: ci-v1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI Orchestrator dependencies
        run: python -m pip install -e "services/ai-orchestrator[dev]"

      - name: Apply migrations
        run: pnpm --filter @faios/database exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Run business API integration test
        run: pnpm --filter @faios/business-api test:integration

      - name: Run execution integration test
        run: pnpm test:integration:execution

      - name: Run GitHub command smoke
        run: pnpm smoke:github:e2e
