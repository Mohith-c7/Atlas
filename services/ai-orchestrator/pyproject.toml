[project]
name = "faios-ai-orchestrator"
version = "0.0.0"
description = "FastAPI service shell for AI planning and MCP orchestration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "langgraph>=0.2.60",
  "pydantic>=2.10.4",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.6"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
