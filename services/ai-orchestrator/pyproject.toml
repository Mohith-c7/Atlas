[project]
name = "faios-ai-orchestrator"
version = "0.0.0"
description = "FastAPI service shell for AI planning and MCP orchestration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "langgraph>=0.2.60",
  "pydantic>=2.10.4",
  "uvicorn[standard]>=0.34.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
